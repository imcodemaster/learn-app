org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 compiles Kotlin itself ("built-in Kotlin"). Flutter's migrator keeps the
# separate Kotlin Gradle plugin for now, because some plugins still apply it.
android.builtInKotlin=false
# The Flutter Gradle plugin still reads the old Android DSL types.
android.newDsl=false
