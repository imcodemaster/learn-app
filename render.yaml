# Render Blueprint: the LearnInCreation backend (Django API + admin panel) and
# its PostgreSQL database, in Render's Singapore region (closest to India).
#
# In Render: New > Blueprint > pick this GitHub repository. Render creates the
# database and the web service, asks for the values marked "sync: false", and
# from then on redeploys automatically after every push to main that changes
# the backend/ folder. Step-by-step guide: README.md, "Go live on Render".
#
# Payments (Razorpay) and SMS sign-in codes are switched on later by adding
# their environment variables in the Render dashboard; no app update needed.

databases:
  - name: learnincreation-db
    databaseName: learnincreation
    user: learnincreation
    region: singapore
    plan: 0.1c-256mb

services:
  - type: web
    name: learnincreation-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    # Uploaded course and lesson images. Paid instance; keeps files across deploys.
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    domains:
      - api.learnincreation.com
    envVars:
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learnincreation-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.learnincreation.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://api.learnincreation.com
      - key: PUBLIC_BASE_URL
        value: https://api.learnincreation.com
      # Render's proxy passes https on; its Cloudflare edge gives the visitor's IP.
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: NUM_PROXIES
        value: "0"
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      - key: MEDIA_ROOT
        value: /app/media
      - key: SERVE_MEDIA
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      # Adds the sample courses, batches and FAQs once, while there are no courses.
      - key: SEED_DEMO_CONTENT
        value: "1"
      - key: PAYMENTS_MODE
        value: razorpay
      # Asked for when you create the Blueprint (see PRODUCTION-SECRETS.txt on your PC).
      - key: ADMIN_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: LearnInCreation Admin
      # Password-reset emails (SMTP). Port 587 with TLS works for Gmail and most mail hosts.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
