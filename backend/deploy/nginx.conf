# Example Nginx site for https://api.learnincreation.com
# Get a free certificate with: sudo certbot --nginx -d api.learnincreation.com
server {
    listen 80;
    server_name api.learnincreation.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.learnincreation.com;

    ssl_certificate     /etc/letsencrypt/live/api.learnincreation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learnincreation.com/privkey.pem;

    client_max_body_size 6m;
    server_tokens off;

    # Uploaded images (when SERVE_MEDIA=0). Never executed, only served as files.
    location /media/ {
        alias /var/www/learnincreation/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'";
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
