# Runs the backend with PostgreSQL on any server that has Docker:
#   cp .env.production.example .env   (then edit it; keep DB_HOST=db)
#   docker compose up -d --build
#   docker compose exec web python manage.py seed_demo
#   docker compose exec web python manage.py createsuperuser
# Put Nginx (see deploy/nginx.conf) or Caddy in front for HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-learnincreation}
      POSTGRES_USER: ${DB_USER:-learnincreation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-learnincreation}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
